<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Rodrigo Capel — Engenheiro de Dados e Desenvolvedor BI">
<style>
.n{font:700 54px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#16181d}
.s{font:600 22px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#4f8cff}
.l{font:400 16px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#57606a}
.ty{font:500 19px Consolas,'SFMono-Regular',Menlo,monospace;fill:#16181d}
.k{font:600 13px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#57606a}
.cur{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef3fb"/></linearGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#e3e8f0" stroke-width="1"/></pattern>
<linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
<mask id="m"><rect width="1200" height="300" fill="url(#fade)"/></mask>
</defs>
<rect width="1200" height="300" rx="16" fill="url(#bg)"/>
<rect width="1200" height="300" rx="16" fill="url(#grid)" mask="url(#m)"/>
<text x="60" y="100" class="n">Rodrigo Capel</text>
<text x="62" y="140" class="s">Engenheiro de Dados · Desenvolvedor BI</text>
<text x="62" y="166" class="l">+10 anos em TI · Cuiabá, MT</text>
<text x="44" y="202" class="ty" fill="#4f8cff" style="fill:#4f8cff">›</text>
<clipPath id="c0"><rect x="60" y="178" height="34" width="0"><animate attributeName="width" values="0;560;560;0;0" keyTimes="0;0.07;0.22;0.245;1" dur="16s" begin="0s" repeatCount="indefinite"/></rect></clipPath>
<text clip-path="url(#c0)" x="60" y="202" class="ty">SQL Server · T-SQL · SSIS · SQL Agent</text><clipPath id="c1"><rect x="60" y="178" height="34" width="0"><animate attributeName="width" values="0;560;560;0;0" keyTimes="0;0.07;0.22;0.245;1" dur="16s" begin="4s" repeatCount="indefinite"/></rect></clipPath>
<text clip-path="url(#c1)" x="60" y="202" class="ty">Python para ETL, APIs e automação</text><clipPath id="c2"><rect x="60" y="178" height="34" width="0"><animate attributeName="width" values="0;560;560;0;0" keyTimes="0;0.07;0.22;0.245;1" dur="16s" begin="8s" repeatCount="indefinite"/></rect></clipPath>
<text clip-path="url(#c2)" x="60" y="202" class="ty">Power BI · DAX · Power Query · Report Server</text><clipPath id="c3"><rect x="60" y="178" height="34" width="0"><animate attributeName="width" values="0;560;560;0;0" keyTimes="0;0.07;0.22;0.245;1" dur="16s" begin="12s" repeatCount="indefinite"/></rect></clipPath>
<text clip-path="url(#c3)" x="60" y="202" class="ty">Integrações ERP: TOTVS Protheus · MXM · RM</text>
<text x="62" y="258" class="l">Sistemas de Informação · Pós em Ciência de Dados</text>

<path d="M800 150 C 850 150, 860 150, 910 150" stroke="#c9d3e1" stroke-width="2" stroke-dasharray="5 6" fill="none"/>
<path d="M990 150 C 1040 150, 1050 150, 1100 150" stroke="#c9d3e1" stroke-width="2" stroke-dasharray="5 6" fill="none"/>
<circle r="4" fill="#4f8cff"><animateMotion dur="1.6s" begin="0s" repeatCount="indefinite" path="M800 150 C 850 150, 860 150, 910 150"/></circle><circle r="4" fill="#4f8cff"><animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite" path="M800 150 C 850 150, 860 150, 910 150"/></circle><circle r="4" fill="#4f8cff"><animateMotion dur="1.6s" begin="0.4s" repeatCount="indefinite" path="M990 150 C 1040 150, 1050 150, 1100 150"/></circle><circle r="4" fill="#4f8cff"><animateMotion dur="1.6s" begin="1.2s" repeatCount="indefinite" path="M990 150 C 1040 150, 1050 150, 1100 150"/></circle>
<!-- Fontes -->
<g transform="translate(720 100)">
<rect width="80" height="100" rx="14" fill="#ffffff" stroke="#c9d3e1"/>
<g transform="translate(20 22)" fill="none" stroke="#4f8cff" stroke-width="3">
<ellipse cx="20" cy="6" rx="20" ry="6"/><path d="M0 6v28c0 3.3 9 6 20 6s20-2.7 20-6V6"/><path d="M0 20c0 3.3 9 6 20 6s20-2.7 20-6"/>
</g><text x="40" y="128" text-anchor="middle" class="k">Fontes</text></g>
<!-- ETL -->
<g transform="translate(910 100)">
<rect width="80" height="100" rx="14" fill="#ffffff" stroke="#4f8cff" stroke-width="2"/>
<g transform="translate(40 50)"><g>
<animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
<circle r="13" fill="none" stroke="#4f8cff" stroke-width="5" stroke-dasharray="6.8 3.4"/>
<circle r="7" fill="none" stroke="#4f8cff" stroke-width="3"/></g></g>
<text x="40" y="128" text-anchor="middle" class="k">ETL</text></g>
<!-- BI -->
<g transform="translate(1100 100)">
<rect width="80" height="100" rx="14" fill="#ffffff" stroke="#c9d3e1"/>
<g fill="#f2c811">
<rect x="18" y="52" width="10" height="20" rx="2"><animate attributeName="height" values="20;30;20" dur="3s" repeatCount="indefinite"/><animate attributeName="y" values="52;42;52" dur="3s" repeatCount="indefinite"/></rect>
<rect x="35" y="40" width="10" height="32" rx="2"/>
<rect x="52" y="28" width="10" height="44" rx="2"><animate attributeName="height" values="44;34;44" dur="3s" repeatCount="indefinite"/><animate attributeName="y" values="28;38;28" dur="3s" repeatCount="indefinite"/></rect>
</g><text x="40" y="128" text-anchor="middle" class="k">BI</text></g>
</svg>